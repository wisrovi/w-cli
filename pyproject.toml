[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "w-cli"
version = "1.0.0"
authors = [
    { name = "William Steve Rodriguez Villamizar", email = "wisrovi.rodriguez@gmail.com" }
]
description = "Central CLI manager and package installer for the wisrovi Libraries Suite"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "cli",
    "manager",
    "installer",
    "wisrovi",
    "monorepo",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.31.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "click>=8.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/wisrovi/w-cli"
Repository = "https://github.com/wisrovi/w-cli"
Issues = "https://github.com/wisrovi/w-cli/issues"

[project.scripts]
w = "module.main:app"

[tool.hatch.build.targets.sdist]
include = [
    "/module",
    "/test",
]
exclude = [
    "**/__pycache__",
    "**/logs",
]

[tool.hatch.build.targets.wheel]
packages = ["module"]
exclude = [
    "**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["module"]
branch = true
omit = [
    "*/tests/*",
    "*/examples/*",
    "module/submodule/*",
]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 80

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
